<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contáctanos - Previnox</title>
  <link rel="stylesheet" href="CSS/contactanos.css">
</head>
<body>

  <section class="contacto">
    <h2>Contáctanos</h2>
    <p>Estamos aquí para escucharte y ayudarte.</p>

    <!-- Información de contacto -->
    <div class="info-contacto">
      <p><strong>Teléfono:</strong> +57 123 456 7890</p>
      <p><strong>Correo:</strong> contacto@previnox.com</p>
      <p><strong>Dirección:</strong> Calle 10 #20-30, Popayán, Cauca</p>
      <p><strong>Horario:</strong> Lunes a Viernes, 8:00 AM – 5:00 PM</p>
    </div>

    <!-- Formulario -->
    <form class="form-contacto">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" required>

      <label for="asunto">Asunto</label>
      <input type="text" id="asunto" name="asunto" required>

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

      <button type="submit">Enviar</button>
    </form>
  </section>

</body>
</html>
